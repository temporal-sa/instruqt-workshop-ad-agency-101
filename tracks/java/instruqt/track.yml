slug: durable-ad-campaign-java-workshop
title: Durable Ad Campaign Roll-Out (Java) with Temporal
teaser: Take CatNip Cola's ad campaign from fragile script to durable workflow.
description: |-
  A hands-on introduction to Temporal with Java. You will launch an ad
  campaign for CatNip Cola, watch a plain Java process lose everything
  mid-launch, then rebuild it as a durable Temporal application: workflows,
  activities, retry policies, error handling - and a finale where you kill
  the worker mid-run and watch the campaign finish anyway. Bonus challenges
  include human-in-the-loop patterns and connecting it all up to the Temporal Cloud!
icon: https://temporal.io/images/icons/temporal-logo.svg
